name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      # The vectors are the contract with the other two platforms. If a change
      # alters them, the change is wrong -- never regenerate to make CI green.
      - name: Vectors are unchanged
        run: |
          npx tsx scripts/generate-vectors.ts
          git diff --exit-code testvectors/
