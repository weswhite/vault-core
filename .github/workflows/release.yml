name: release

on:
  release:
    types: [published]

# Publishing from CI with OIDC means no long-lived npm token exists anywhere.
# For a package that ships crypto to three apps, a leaked token is the most
# realistic supply-chain risk, so this is worth the extra setup.
permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      # OIDC trusted publishing needs npm >= 11.5.1. The runner ships 10.9.x,
      # which signs the provenance statement and then 404s on the PUT because it
      # never sends an OIDC token -- a confusing failure that looks like a
      # missing package rather than a missing auth mechanism.
      - run: npm install -g npm@latest
      - run: npm --version

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm publish --provenance --access public
